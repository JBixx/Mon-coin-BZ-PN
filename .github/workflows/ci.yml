name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Annule les exécutions précédentes d'une même PR / branche quand un nouveau commit arrive
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Prettier
        run: npm run format:check

  test:
    name: Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Tests unitaires & d'intégration + couverture
        run: npm run test:coverage
      - name: Envoi de la couverture à Codecov
        if: matrix.node-version == 22
        uses: codecov/codecov-action@v5
        with:
          files: coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  build:
    name: Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Installation (sans scripts tiers)
        run: npm ci --ignore-scripts
      - name: Audit des dépendances de production
        run: npm audit --omit=dev --audit-level=high
      - name: Vérification du build
        run: npm run build
      - name: Vérification du paquet
        run: npm pack --dry-run
